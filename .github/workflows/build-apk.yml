name: Build HARZ Mesh Test APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
      JAVA_TOOL_OPTIONS: "-Xmx2g"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Init React Native project (community CLI)
        run: |
          npx --yes @react-native-community/cli@latest init harzmeshtest --pm npm --skip-install --skip-git-init
          ls -la harzmeshtest/package.json && echo "package.json exists OK"
        timeout-minutes: 15

      - name: Install dependencies and mesh SDK
        run: |
          cd harzmeshtest
          sed -i 's/"typescript": "5\.[0-9]\+\.[0-9]\+"/"typescript": "5.4.5"/g' package.json
          npm install --legacy-peer-deps
          npm install @offline-protocol/mesh-sdk@0.24.1 --legacy-peer-deps --force
        timeout-minutes: 15

      - name: Copy App.tsx into project
        run: cp App.tsx harzmeshtest/App.tsx

      - name: Add BLE permissions to AndroidManifest
        run: |
          cd harzmeshtest/android/app/src/main
          sed -i '/<application/i             <uses-permission android:name="android.permission.BLUETOOTH" />            <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />            <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />            <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />            <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />' AndroidManifest.xml

      - name: Restrict ABI to arm64-v8a + armeabi-v7a (shrink APK for real phones)
        run: |
          cd harzmeshtest/android/app
          python3 - <<'EOF'
          import re
          path = "build.gradle"
          with open(path) as f:
              content = f.read()
          # Inject ndk abiFilters into defaultConfig block
          pattern = r"(defaultConfig\s*\{)"
          replacement = r"\1\n        ndk {\n            abiFilters 'armeabi-v7a', 'arm64-v8a'\n        }"
          new_content, count = re.subn(pattern, replacement, content, count=1)
          if count == 0:
              print("WARNING: defaultConfig block not found, abiFilters not injected")
          else:
              with open(path, "w") as f:
                  f.write(new_content)
              print("Injected ABI filters into defaultConfig")
          EOF

      - name: Enable resource/code shrinking for debug build size
        run: |
          cd harzmeshtest/android/app
          python3 - <<'EOF'
          path = "build.gradle"
          with open(path) as f:
              content = f.read()
          if "shrinkResources" not in content:
              content = content.replace(
                  "buildTypes {",
                  "buildTypes {\n        debug {\n            shrinkResources false\n            minifyEnabled false\n        }",
                  1
              )
              with open(path, "w") as f:
                  f.write(content)
              print("Patched buildTypes for debug")
          else:
              print("shrinkResources already present, skipping")
          EOF

      - name: Debug - show generated build.gradle and settings.gradle
        run: |
          echo "=== app/build.gradle ==="
          cat harzmeshtest/android/app/build.gradle
          echo ""
          echo "=== settings.gradle ==="
          cat harzmeshtest/android/settings.gradle
          echo ""
          echo "=== build.gradle (root) ==="
          cat harzmeshtest/android/build.gradle

      - name: Build Debug APK
        run: |
          cd harzmeshtest/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        timeout-minutes: 25

      - name: Show APK sizes
        if: always()
        run: |
          find harzmeshtest/android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harz-mesh-test-apk
          path: |
            harzmeshtest/android/app/build/outputs/apk/debug/app-debug.apk
            harzmeshtest/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            harzmeshtest/android/app/build/reports/
            harzmeshtest/android/build/
            harzmeshtest/android/app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore
