name: Build HARZ Mesh Test APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
      JAVA_TOOL_OPTIONS: "-Xmx2g"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Create React Native project (skip install)
        run: |
          npx --yes react-native@0.75.3 init harzmeshtest --pm npm --skip-git-init --skip-install
          echo "=== Init exit code: $? ==="
          ls -la harzmeshtest/ || echo "DIRECTORY NOT FOUND"
          test -f harzmeshtest/package.json && echo "package.json EXISTS" || echo "package.json MISSING"
        timeout-minutes: 20

      - name: Patch and install dependencies
        run: |
          cd harzmeshtest
          # Verify we have package.json
          test -f package.json || { echo "FATAL: package.json not found, init failed"; exit 1; }
          # Fix any phantom typescript versions
          sed -i 's/"typescript": "5.[0-9]\.[0-9]"/"typescript": "5.5.4"/g' package.json
          echo "=== package.json deps ==="
          cat package.json | grep -E "typescript|react-native" || true
          # Install dependencies
          npm install --legacy-peer-deps
          # Install mesh SDK
          npm install @offline-protocol/mesh-sdk@0.24.1 --legacy-peer-deps --force
        timeout-minutes: 15

      - name: Copy App.tsx into project
        run: cp App.tsx harzmeshtest/App.tsx

      - name: Add BLE permissions to AndroidManifest
        run: |
          cd harzmeshtest/android/app/src/main
          sed -i '/<application/i \
            <uses-permission android:name="android.permission.BLUETOOTH" />\
            <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\
            <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\
            <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />\
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\
            <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />' AndroidManifest.xml
          echo "=== AndroidManifest updated ==="

      - name: Patch app/build.gradle for mesh SDK compatibility
        run: |
          cd harzmeshtest/android/app
          sed -i 's/compileSdk [0-9]*/compileSdk 34/g' build.gradle
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' build.gradle
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' build.gradle
          sed -i 's/minSdk [0-9]*/minSdk 24/g' build.gradle
          echo "=== build.gradle patched ==="
          grep -E 'compileSdk|minSdk' build.gradle

      - name: Build Debug APK
        run: |
          cd harzmeshtest/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        timeout-minutes: 25

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harz-mesh-test-apk
          path: |
            harzmeshtest/android/app/build/outputs/apk/debug/app-debug.apk
            harzmeshtest/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            harzmeshtest/android/app/build/reports/
            harzmeshtest/android/build/
            harzmeshtest/android/app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore
