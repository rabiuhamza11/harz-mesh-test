name: Build HARZ Mesh Test APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
      JAVA_TOOL_OPTIONS: "-Xmx2g"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Init React Native project (community CLI)
        run: |
          npx --yes @react-native-community/cli@latest init harzmeshtest --pm npm --skip-install --skip-git-init
          if [ ! -f harzmeshtest/package.json ]; then
            echo "FATAL: package.json not created"
            ls -la harzmeshtest/ 2>/dev/null || echo "Directory not created"
            exit 1
          fi
          echo "=== package.json exists ==="
          head -30 harzmeshtest/package.json
        timeout-minutes: 15

      - name: Fix deps and install mesh SDK
        run: |
          cd harzmeshtest
          # Patch any phantom typescript versions
          sed -i 's/"typescript": "5\.[0-4]\.[0-9]"/"typescript": "5.5.4"/g' package.json
          grep typescript package.json || echo "No typescript dep found"
          # Install base deps
          npm install --legacy-peer-deps
          # Install mesh SDK
          npm install @offline-protocol/mesh-sdk@0.24.1 --legacy-peer-deps --force
          echo "=== Install complete ==="
        timeout-minutes: 15

      - name: Copy App.tsx into project
        run: cp App.tsx harzmeshtest/App.tsx

      - name: Add BLE permissions to AndroidManifest
        run: |
          cd harzmeshtest/android/app/src/main
          sed -i '/<application/i             <uses-permission android:name="android.permission.BLUETOOTH" />            <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />            <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />            <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />            <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />' AndroidManifest.xml
          echo "=== AndroidManifest updated ==="

      - name: Patch app/build.gradle for mesh SDK compatibility
        run: |
          cd harzmeshtest/android/app
          sed -i 's/compileSdk 33/compileSdk 34/g' build.gradle
          sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' build.gradle
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' build.gradle
          sed -i 's/minSdk [0-9]*/minSdk 24/g' build.gradle
          echo "=== build.gradle patched ==="
          grep -E 'compileSdk|minSdk' build.gradle

      - name: Build Debug APK
        run: |
          cd harzmeshtest/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        timeout-minutes: 25

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harz-mesh-test-apk
          path: |
            harzmeshtest/android/app/build/outputs/apk/debug/app-debug.apk
            harzmeshtest/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            harzmeshtest/android/app/build/reports/
            harzmeshtest/android/build/
            harzmeshtest/android/app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore
