name: Build HARZ Mesh Test APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    env:
      GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
      JAVA_TOOL_OPTIONS: "-Xmx2g"
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      
      - name: Create React Native project
        run: |
          npx react-native@0.74.3 init harzmeshtest --pm npm --skip-git-ignore
        timeout-minutes: 10
      
      - name: Install mesh SDK
        run: |
          cd harzmeshtest
          npm install @offline-protocol/mesh-sdk@0.24.1
        timeout-minutes: 5
      
      - name: Copy App.tsx into project
        run: cp App.tsx harzmeshtest/App.tsx
      
      - name: Add BLE permissions to AndroidManifest
        run: |
          cd harzmeshtest/android/app/src/main
          python3 << 'PYEOF'
          with open('AndroidManifest.xml', 'r') as f:
              content = f.read()
          
          # Only add if not already present
          if 'BLUETOOTH_SCAN' not in content:
              perms = '''    <uses-permission android:name="android.permission.BLUETOOTH" />
        <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
        <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
        <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
        <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
        <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
        <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
        <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />
        <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
        <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />
    '''
              content = content.replace('<application', perms + '    <application')
              with open('AndroidManifest.xml', 'w') as f:
                  f.write(content)
              print("Permissions added successfully")
          else:
              print("Permissions already present, skipping")
          PYEOF
      
      - name: Patch app/build.gradle for mesh SDK compatibility
        run: |
          cd harzmeshtest/android/app
          python3 << 'PYEOF'
          with open('build.gradle', 'r') as f:
              content = f.read()
          
          # Ensure compileSdk is 34 (mesh SDK requires it)
          content = content.replace('compileSdk 33', 'compileSdk 34')
          content = content.replace('compileSdkVersion 33', 'compileSdkVersion 34')
          
          # Ensure minSdk is at least 24 (mesh SDK requires it)
          import re
          content = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 24', content)
          content = re.sub(r'minSdk\s+\d+', 'minSdk 24', content)
          
          with open('build.gradle', 'w') as f:
              f.write(content)
          print("build.gradle patched")
          PYEOF
      
      - name: Build Debug APK
        run: |
          cd harzmeshtest/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        timeout-minutes: 25
      
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harz-mesh-test-apk
          path: |
            harzmeshtest/android/app/build/outputs/apk/debug/app-debug.apk
            harzmeshtest/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            harzmeshtest/android/app/build/reports/
            harzmeshtest/android/build/
            harzmeshtest/android/app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore
