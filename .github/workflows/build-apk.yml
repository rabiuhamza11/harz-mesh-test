name: Build HARZ Mesh Test APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Xmx3g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
      JAVA_TOOL_OPTIONS: "-Xmx2g"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Init React Native project (community CLI)
        run: |
          npx --yes @react-native-community/cli@latest init harzmeshtest --pm npm --skip-install --skip-git-init
          ls -la harzmeshtest/package.json && echo "package.json exists OK"
        timeout-minutes: 15

      - name: Install dependencies and mesh SDK
        run: |
          cd harzmeshtest
          sed -i 's/"typescript": "5\.[0-9]\+\.[0-9]\+"/"typescript": "5.4.5"/g' package.json
          npm install --legacy-peer-deps
          npm install @offline-protocol/mesh-sdk@0.24.1 --legacy-peer-deps --force
        timeout-minutes: 15

      - name: Copy App.tsx into project
        run: cp App.tsx harzmeshtest/App.tsx

      - name: Add BLE permissions to AndroidManifest
        run: |
          cd harzmeshtest/android/app/src/main
          sed -i '/<application/i             <uses-permission android:name="android.permission.BLUETOOTH" />            <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />            <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />            <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />            <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />' AndroidManifest.xml

      - name: Restrict ABI via gradle.properties (real lever for RN 0.71+)
        run: |
          cd harzmeshtest/android
          if grep -q "^reactNativeArchitectures=" gradle.properties; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' gradle.properties
          else
            echo "reactNativeArchitectures=armeabi-v7a,arm64-v8a" >> gradle.properties
          fi
          echo "=== gradle.properties reactNativeArchitectures line ==="
          grep reactNativeArchitectures gradle.properties

      - name: Debug - show generated build.gradle and settings.gradle
        run: |
          echo "=== app/build.gradle ==="
          cat harzmeshtest/android/app/build.gradle
          echo ""
          echo "=== gradle.properties ==="
          cat harzmeshtest/android/gradle.properties
          echo ""
          echo "=== settings.gradle ==="
          cat harzmeshtest/android/settings.gradle

      - name: Build Debug APK
        run: |
          cd harzmeshtest/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        timeout-minutes: 25

      - name: Show APK sizes
        if: always()
        run: |
          find harzmeshtest/android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harz-mesh-test-apk
          path: |
            harzmeshtest/android/app/build/outputs/apk/debug/app-debug.apk
            harzmeshtest/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            harzmeshtest/android/app/build/reports/
            harzmeshtest/android/build/
            harzmeshtest/android/app/build/outputs/logs/
          retention-days: 7
          if-no-files-found: ignore
